<!-- Status banner: colored status div + Start/Stop buttons -->
<div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
  <div id="gw_status_text" style="flex:1; min-height:3rem; padding:0.5rem 1rem; border-radius:4px; background:#d0021b; color:white; font-weight:500; display:flex; align-items:center;">Gateway nicht aktiv</div>
  <a id="btn_restart" href="#" class="lb-btn lb-btn-sm lb-btn-icon">
    <i class="pi pi-refresh"></i> Neustart
  </a>
  <a id="btn_stop" href="#" class="lb-btn lb-btn-sm lb-btn-icon">
    <i class="pi pi-times"></i> Stoppen
  </a>
</div>

<!-- Cards -->
<div style="display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-start; margin-bottom:1.5rem;">

  <!-- Token / Cloud-Anmeldung card -->
  <div class="lb-card" style="flex:1 1 220px;">
    <div class="lb-card-body">
      <div class="lb-section-title">Cloud-Anmeldung</div>
      <div class="lb-form-row">
        <div class="lb-form-label">Status</div>
        <div class="lb-form-field">
          <span id="token_badge" class="lb-badge lb-badge-danger">Nicht eingeloggt</span>
        </div>
      </div>
      <div class="lb-form-row">
        <div class="lb-form-label">Gültig noch</div>
        <div class="lb-form-field">
          <span id="token_expires">--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Geräte card -->
  <div class="lb-card" style="flex:1 1 220px;">
    <div class="lb-card-body">
      <div class="lb-section-title">Geräte</div>
      <div id="devices_list">
        <TMPL_IF HAS_DEVICES>
          <ul class="lb-list">
            <TMPL_LOOP DEVICES>
              <li><TMPL_VAR DEVICE_NAME> <small>(<TMPL_VAR DEVICE_MODEL>)</small> &mdash; <small><TMPL_VAR DEVICE_TYPE></small></li>
            </TMPL_LOOP>
          </ul>
        <TMPL_ELSE>
          <p>Keine Geräte &mdash; Gateway starten um Geräteliste zu laden.</p>
        </TMPL_IF>
      </div>
    </div>
  </div>

</div>
